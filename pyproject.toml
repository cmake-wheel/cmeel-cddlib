[build-system]
build-backend = "cmeel"
requires = ["cmeel[build]"]

[project]
description = "cmeel distribution for cddlib"
license = "GPL"
name = "cmeel-cddlib"
requires-python = ">= 3.9"
version = "0.94.14"

[project.urls]
homepage = "https://github.com/cmake-wheel/cmeel-cddlib"
upstream = "https://github.com/cddlib/cddlib"

[tool.cmeel]
build-number = 2
has-sitelib = false
run-tests = false
upstream-version = "0.94n"

[tool.tomlsort]
all = true
